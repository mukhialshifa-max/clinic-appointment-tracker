# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Needs a MySQL database called "clinic" (see README).
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clinic
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:change_me}
  h2:
    console:
      enabled: false
